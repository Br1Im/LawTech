version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: lawtech-db
    mem_limit: 700m
    memswap_limit: 1400m
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=lawtech_root_password_2024
      - MYSQL_DATABASE=lawtech_crm
      - MYSQL_USER=lawtech_user
      - MYSQL_PASSWORD=lawtech_password_2024
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/database/migrations:/docker-entrypoint-initdb.d
    networks:
      - lawtech-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # FAISS AI Service
  faiss-service:
    build:
      context: ./server/scripts
      dockerfile: Dockerfile
    container_name: lawtech-faiss
    mem_limit: 650m
    memswap_limit: 1300m
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=5000
    networks:
      - lawtech-network

  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lawtech-backend
    mem_limit: 256m
    memswap_limit: 512m
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DEFAULT_OFFICE_TIMEZONE=Asia/Tomsk
      - FAISS_SERVICE_URL=http://faiss-service:5000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=lawtech_user
      - DB_PASSWORD=lawtech_password_2024
      - DB_NAME=lawtech_crm
      - JWT_SECRET=f88e3310dbc6d3863169fb2d29759dab646626214052b32e61d290b778ff32cc
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=*
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=10485760
      - SMTP_HOST=smtp.yandex.ru
      - SMTP_PORT=465
      - SMTP_USER=lawtech.rf@yandex.com
      - SMTP_PASS=atnlwmmadilurmjf
      - MAIL_FROM=Law.Tech <lawtech.rf@yandex.com>
    depends_on:
      - db
      - faiss-service
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - lawtech-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lawtech-frontend
    mem_limit: 64m
    memswap_limit: 128m
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - backend
    networks:
      - lawtech-network

volumes:
  mysql-data:
    driver: local

networks:
  lawtech-network:
    driver: bridge