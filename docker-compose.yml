version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: lawtech-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=lawtech_root_password_2024
      - MYSQL_DATABASE=lawtech_crm
      - MYSQL_USER=lawtech_user
      - MYSQL_PASSWORD=lawtech_password_2024
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/database/migrations:/docker-entrypoint-initdb.d
    networks:
      - lawtech-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # FAISS AI Service
  faiss-service:
    build:
      context: ./server/scripts
      dockerfile: Dockerfile
    container_name: lawtech-faiss
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=5000
    networks:
      - lawtech-network

  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lawtech-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - FAISS_SERVICE_URL=http://faiss-service:5000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=lawtech_user
      - DB_PASSWORD=lawtech_password_2024
      - DB_NAME=lawtech_crm
      - JWT_SECRET=your_super_secret_jwt_key_change_this_in_production_2024
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=*
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=10485760
    depends_on:
      - db
      - faiss-service
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - lawtech-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lawtech-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - lawtech-network

volumes:
  mysql-data:
    driver: local

networks:
  lawtech-network:
    driver: bridge