<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1E40AF" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>LawTech CRM v5</title>
    
    <!-- Мобильные стили INLINE v5 -->
    <style>
      /* ===== МОБИЛЬНАЯ АДАПТАЦИЯ v5 ===== */
      
      * {
        -webkit-tap-highlight-color: transparent;
      }
      
      @media (max-width: 768px) {
        body {
          font-size: 14px !important;
          overflow-x: hidden !important;
          -webkit-overflow-scrolling: touch !important;
          margin: 0 !important;
          padding: 0 !important;
        }
        
        /* Скрываем обычный сайдбар на мобильном */
        .sidebar,
        .ant-layout-sider:not(.mobile-sider) {
          display: none !important;
        }
        
        /* Контент на весь экран */
        .ant-layout-content {
          margin: 0 !important;
          padding: 8px !important;
          width: 100vw !important;
          box-sizing: border-box !important;
        }
        
        /* Таблицы - горизонтальный скролл */
        .ant-table-wrapper {
          overflow-x: auto !important;
          -webkit-overflow-scrolling: touch !important;
          width: 100% !important;
        }
        
        .ant-table {
          font-size: 12px !important;
          min-width: 500px !important;
        }
        
        .ant-table-thead > tr > th,
        .ant-table-tbody > tr > td {
          padding: 8px 6px !important;
          font-size: 11px !important;
        }
        
        /* Модальные окна - полноэкранные */
        .ant-modal {
          max-width: 100vw !important;
          margin: 0 !important;
          top: 0 !important;
          padding: 0 !important;
        }
        
        .ant-modal-content {
          border-radius: 0 !important;
          height: 100vh !important;
          display: flex !important;
          flex-direction: column !important;
        }
        
        .ant-modal-body {
          flex: 1 !important;
          overflow-y: auto !important;
          padding: 12px !important;
        }
        
        /* Drawer - полноэкранный */
        .ant-drawer-content-wrapper {
          width: 100vw !important;
          max-width: 100vw !important;
        }
        
        /* Формы */
        .ant-form-item {
          margin-bottom: 10px !important;
        }
        
        .ant-input,
        .ant-select-selector,
        .ant-picker {
          font-size: 16px !important;
        }
        
        /* Кнопки */
        .ant-btn {
          padding: 6px 12px !important;
          font-size: 13px !important;
        }
        
        /* Табы */
        .ant-tabs-nav {
          min-width: max-content !important;
        }
        
        .ant-tabs-tab {
          padding: 8px 12px !important;
          font-size: 13px !important;
          white-space: nowrap !important;
        }
        
        /* Скрываем лишнее */
        .hide-on-mobile {
          display: none !important;
        }
        
        /* Hamburger button виден */
        .hamburger-button {
          display: flex !important;
        }
      }
      
      @media (max-width: 480px) {
        body {
          font-size: 13px !important;
        }
        
        .ant-table {
          font-size: 11px !important;
          min-width: 400px !important;
        }
        
        .ant-btn {
          padding: 4px 10px !important;
          font-size: 12px !important;
        }
        
        .ant-modal-body {
          padding: 8px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader" style="display:flex;align-items:center;justify-content:center;height:100vh;background:#1e40af;">
        <div style="text-align:center;">
          <div style="width:40px;height:40px;border:4px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;"></div>
          <div style="color:#fff;font-size:14px;">Загрузка LawTech v5...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Удаляем старый Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(registration) {
            registration.unregister();
          });
        });
      }
    </script>
  </body>
</html>
