<!DOCTYPE html>
<html>
<head>
    <title>Test Calendar API</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .event { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Тест API Календаря</h1>
    
    <div>
        <label>Email: <input type="text" id="email" value="admin@lawtech.ru"></label><br>
        <label>Password: <input type="password" id="password" value="admin123"></label><br>
        <button onclick="login()">Войти</button>
    </div>
    
    <div id="token-info"></div>
    
    <div>
        <label>Office ID: <input type="text" id="officeId" value="4"></label><br>
        <button onclick="fetchEvents()">Получить события</button>
    </div>
    
    <div id="result"></div>
    
    <script>
        let token = '';
        
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('http://localhost:3001/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.token) {
                    token = data.token;
                    document.getElementById('token-info').innerHTML = 
                        '<p class="success">✅ Вход выполнен! Token: ' + token.substring(0, 20) + '...</p>';
                } else {
                    document.getElementById('token-info').innerHTML = 
                        '<p class="error">❌ Ошибка входа: ' + JSON.stringify(data) + '</p>';
                }
            } catch (error) {
                document.getElementById('token-info').innerHTML = 
                    '<p class="error">❌ Ошибка: ' + error.message + '</p>';
            }
        }
        
        async function fetchEvents() {
            if (!token) {
                alert('Сначала войдите в систему!');
                return;
            }
            
            const officeId = document.getElementById('officeId').value;
            
            try {
                const response = await fetch(`http://localhost:3001/api/office/${officeId}/calendar-events`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    let html = '<h2 class="success">✅ Получено событий: ' + data.events.length + '</h2>';
                    
                    data.events.forEach(event => {
                        html += `
                            <div class="event">
                                <strong>${event.title}</strong><br>
                                Дата: ${event.date}<br>
                                Время: ${event.time}<br>
                                Тип: ${event.type}<br>
                                ${event.description ? 'Описание: ' + event.description + '<br>' : ''}
                            </div>
                        `;
                    });
                    
                    document.getElementById('result').innerHTML = html;
                } else {
                    document.getElementById('result').innerHTML = 
                        '<p class="error">❌ Ошибка: ' + data.message + '</p>';
                }
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    '<p class="error">❌ Ошибка: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
